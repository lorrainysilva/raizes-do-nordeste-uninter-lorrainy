<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Cartão Fidelidade</title>
    <link rel="stylesheet" href="estilo/fidelidade.css"> 
</head>
<body>

    <div>
        <header class="topo-pagamento">
            <div>
                <h1>Raízes do Nordeste</h1>
            </div>
        </header>

        <main class="cartao">
            <div class="cartao-fundo">
                <h2 class="titulo-ponto">Meus Pontos</h2>
                
                <div class="cartao-fidelidade">
                    <div class="topo-cartao">
                        <h3>Raízes Fidelidade</h3>
                        <span class="status-pontos"><span id="saldo-pontos">0</span>/10 Pontos</span>
                    </div>
                    <p class="recompensa">A cada R$ 10,00 em compras, você ganha 1 carimbo!</p>
                    
                    <div class="carimbos">
                        <div class="carimbo" data-ponto="1">1</div>
                        <div class="carimbo" data-ponto="2">2</div>
                        <div class="carimbo" data-ponto="3">3</div>
                        <div class="carimbo" data-ponto="4">4</div>
                        <div class="carimbo" data-ponto="5">5</div>
                        <div class="carimbo" data-ponto="6">6</div>
                        <div class="carimbo" data-ponto="7">7</div>
                        <div class="carimbo" data-ponto="8">8</div>
                        <div class="carimbo" data-ponto="9">9</div>
                        <div class="carimbo" data-ponto="10">10</div>
                    </div>
                </div>

                <div class="voltar">
                    <a href="cardapio.html" class="cardapio">Voltar ao Cardápio</a>
                </div>
            </div>
        </main>

    </div>

    <script src="java.script/fidelidade.js"></script>
</body>
</html>
